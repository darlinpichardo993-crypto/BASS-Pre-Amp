name: Build ORYMY Bass Windows x64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload VST3 and Standalone Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrymyBass-Binaries
        path: |
          build/OrymyBass_artefacts/Release/VST3/
          build/OrymyBass_artefacts/Release/Standalone/
